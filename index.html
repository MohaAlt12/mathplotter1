<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MathPlotter - Build V1.3</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --panel-bg: #ffffff;
      --text-color: #0f172a;
      --border-color: #e2e8f0;
      --accent-color: #2563eb;
    }

    body.dark-mode {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --text-color: #f8fafc;
      --border-color: #334155;
      --accent-color: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .version-badge {
      font-size: 0.72rem;
      font-weight: 700;
      background: #eff6ff;
      color: var(--accent-color);
      border: 1px solid #bfdbfe;
      padding: 3px 8px;
      border-radius: 9999px;
      white-space: normal;
      word-break: break-word;
      max-width: 100%;
      display: inline-block;
      text-align: center;
    }

    body.dark-mode .version-badge {
      background: #1e3a8a;
      color: #93c5fd;
      border-color: #1d4ed8;
    }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #sidebar {
      width: 340px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .expression-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .expr-card {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 8px;
    }

    .expr-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .expr-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-color);
      font-family: monospace;
      font-size: 14px;
      outline: none;
    }

    .outcome-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-color);
      margin-top: 4px;
    }

    #canvas-viewport {
      flex: 1;
      position: relative;
      background: var(--bg-color);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #coordsDisplay {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
    }

    .math-keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 8px;
      background: var(--panel-bg);
      border-top: 1px solid var(--border-color);
    }

    .math-keypad button {
      padding: 8px;
      font-size: 12px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 4px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .main-container { flex-direction: column-reverse; }
      #sidebar { width: 100%; height: 50%; }
      .version-badge { font-size: 0.65rem; padding: 2px 6px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h3>MathPlotter</h3>
      <span class="version-badge">[ V1.3 ● 2026_8_28 ]</span>
    </div>
    <button id="themeToggle" style="padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border-color);">Toggle Mode</button>
  </header>

  <div class="main-container">
    <div id="sidebar">
      <div class="expression-list" id="expressionList"></div>
      <div class="math-keypad">
        <button onclick="insertTool('text(\&quot;\&quot;, 0, 0)')">text("")</button>
        <button onclick="insertTool('mag(vector(3,4))')">mag()</button>
        <button onclick="insertTool('vector(1,2) + vector(3,4)')">vec +</button>
        <button onclick="insertTool('vector(1,2,3) • vector(4,5,6)')">vec •</button>
        <button onclick="insertTool('sum2(x+y, x{1,2}, y{1,3})')">sum2</button>
        <button onclick="insertTool('integral(x, 0, 4)')">∫</button>
      </div>
    </div>

    <div id="canvas-viewport">
      <canvas id="graphCanvas"></canvas>
      <canvas id="webglCanvas" style="display:none;"></canvas>
      <div id="coordsDisplay">Center: (0.00, 0.00) Scale: 10.0u</div>
    </div>
  </div>

  <script type="module">
    import { state, initEngine, draw, evaluateOutcome, bindExpressionInput, updateMathInput } from './mathengine.js';

    window.addEventListener('DOMContentLoaded', () => {
      initEngine();
      renderUI();
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      document.getElementById('themeToggle').addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        draw();
      });
    });

    function resizeCanvas() {
      const canvas = document.getElementById('graphCanvas');
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      draw();
    }

    function renderUI() {
      const container = document.getElementById('expressionList');
      container.innerHTML = '';

      state.expressions.forEach(expr => {
        const card = document.createElement('div');
        card.className = 'expr-card';

        const inputRow = document.createElement('div');
        inputRow.className = 'expr-input-row';

        const colorDot = document.createElement('div');
        colorDot.style.cssText = `width: 10px; height: 10px; border-radius: 50%; background: ${expr.color};`;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'expr-input';
        input.value = expr.raw;
        input.id = `input-expr-${expr.id}`;

        inputRow.appendChild(colorDot);
        inputRow.appendChild(input);
        card.appendChild(inputRow);

        const outcomeText = evaluateOutcome(expr.raw);
        if (outcomeText) {
          const outcomeEl = document.createElement('div');
          outcomeEl.className = 'outcome-label';
          outcomeEl.innerText = outcomeText;
          card.appendChild(outcomeEl);
        }

        container.appendChild(card);
        bindExpressionInput(input, expr.id);
      });
    }

    window.insertTool = function(snippet) {
      const activeEl = document.activeElement;
      if (activeEl && activeEl.tagName === 'INPUT') {
        updateMathInput(activeEl, snippet);
        activeEl.dispatchEvent(new Event('input', { bubbles: true }));
      } else if (state.expressions.length > 0) {
        const firstInput = document.getElementById(`input-expr-${state.expressions[0].id}`);
        if (firstInput) {
          updateMathInput(firstInput, snippet);
          firstInput.dispatchEvent(new Event('input', { bubbles: true }));
        }
      }
    };
  </script>
</body>
</html>
